<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>RPN Scientific Calculator</title>
<meta name="description" content="A reverse Polish notation scientific calculator, installable as a PWA." />
<meta name="theme-color" content="#1a1a2e" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RPN Calc" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="calc">
  <header class="calc-header">
    <span class="title">RPN Scientific</span>
    <div class="mode-toggle">
      <button id="angleMode" class="pill" type="button" aria-label="Toggle degrees/radians">DEG</button>
      <button id="installBtn" class="pill hidden" type="button">Install</button>
    </div>
  </header>

  <div class="display" id="display">
    <div class="stack" id="stack"></div>
    <div class="entry-row">
      <span class="entry-label">x:</span>
      <span class="entry" id="entry">0</span>
    </div>
  </div>

  <div class="keys">
    <button class="key fn" data-action="drop">Drop</button>
    <button class="key fn" data-action="swap">x⇄y</button>
    <button class="key fn" data-action="clear-entry">CE</button>
    <button class="key fn danger" data-action="clear-all">AC</button>

    <button class="key sci" data-action="fn" data-fn="sin">sin</button>
    <button class="key sci" data-action="fn" data-fn="cos">cos</button>
    <button class="key sci" data-action="fn" data-fn="tan">tan</button>
    <button class="key sci" data-action="fn" data-fn="inv">1/x</button>

    <button class="key sci" data-action="fn" data-fn="ln">ln</button>
    <button class="key sci" data-action="fn" data-fn="log10">log</button>
    <button class="key sci" data-action="fn" data-fn="sqrt">√x</button>
    <button class="key sci" data-action="fn" data-fn="square">x²</button>

    <button class="key sci" data-action="const" data-const="pi">π</button>
    <button class="key sci" data-action="const" data-const="e">e</button>
    <button class="key sci" data-action="fn" data-fn="exp">eˣ</button>
    <button class="key op" data-action="op" data-op="pow">yˣ</button>

    <button class="key enter" data-action="enter">Enter ↑</button>
    <button class="key num" data-action="sign">±</button>
    <button class="key fn" data-action="backspace">⌫</button>

    <button class="key op" data-action="op" data-op="sub">−</button>
    <button class="key num" data-action="digit" data-digit="7">7</button>
    <button class="key num" data-action="digit" data-digit="8">8</button>
    <button class="key num" data-action="digit" data-digit="9">9</button>

    <button class="key op" data-action="op" data-op="add">+</button>
    <button class="key num" data-action="digit" data-digit="4">4</button>
    <button class="key num" data-action="digit" data-digit="5">5</button>
    <button class="key num" data-action="digit" data-digit="6">6</button>

    <button class="key op" data-action="op" data-op="mul">×</button>
    <button class="key num" data-action="digit" data-digit="1">1</button>
    <button class="key num" data-action="digit" data-digit="2">2</button>
    <button class="key num" data-action="digit" data-digit="3">3</button>

    <button class="key op" data-action="op" data-op="div">÷</button>
    <button class="key num" data-action="digit" data-digit="0">0</button>
    <button class="key num" data-action="decimal">.</button>
    <button class="key sci" data-action="percent">%</button>
  </div>

  <div class="tape-panel">
    <div class="tape-header">
      <span class="tape-title">Tape</span>
      <div class="tape-actions">
        <button id="exportTape" class="pill" type="button">Export .txt</button>
        <button id="clearTape" class="pill" type="button">Clear tape</button>
      </div>
    </div>
    <div class="tape" id="tape"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
